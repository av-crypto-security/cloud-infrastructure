---
- name: Configure NGINX on managed web servers
  hosts: webservers
  become: true
  gather_facts: true

  tasks:

    - name: Install NGINX
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy NGINX default site configuration
      ansible.builtin.template:
        src: ../templates/nginx-default.conf.j2
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
      notify: Reload NGINX

    - name: Deploy custom HTML page
      ansible.builtin.template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Ensure NGINX is enabled and running
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Verify HTTP response
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}"
        status_code: 200
        return_content: true
      delegate_to: localhost
      become: false
      register: nginx_http_check

    - name: Display HTTP response status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} returned HTTP {{ nginx_http_check.status }}"

  handlers:

    - name: Reload NGINX
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
